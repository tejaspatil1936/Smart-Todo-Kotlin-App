name: build-apk
# Builds a debug APK on every push (and on demand). Download it from the
# run's Artifacts and install it on your phone. Skips itself until the
# Android project exists (after build step 1).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate until gradlew exists
        id: gate
        run: |
          if [ -f gradlew ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.go == 'true'
      - name: Build debug APK
        if: steps.gate.outputs.go == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.go == 'true'
        with:
          name: ink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
