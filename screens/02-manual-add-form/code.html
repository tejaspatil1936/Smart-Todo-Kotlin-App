<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — New todo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
</head>
<body>
<div class="screen">
  <!-- Home, behind the scrim -->
  <div aria-hidden="true">
    <div class="statusbar"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>
    <header class="page-head">
      <div class="row"><span class="t-label t-2">Today</span><span class="t-mono t-caption t-2">4 LEFT</span></div>
      <div class="row"><span class="t-title">Sat, Aug 23</span><span class="icon t-2">cloud_done</span></div>
    </header>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="sheet-title" class="sheet-title">New todo</h2>

    <div class="field">
      <label for="title" class="t-label">Title</label>
      <input id="title" class="input" type="text" value="Gym"/>
    </div>

    <div class="sheet-section" role="group" aria-labelledby="lbl-date">
      <span id="lbl-date" class="t-label">Date</span>
      <div class="chip-row">
        <button class="chip" aria-pressed="true">Today</button>
        <button class="chip" aria-pressed="false">Tomorrow</button>
        <button class="chip" aria-pressed="false">Pick date…</button>
      </div>
    </div>

    <div class="sheet-section" role="group" aria-labelledby="lbl-time">
      <span id="lbl-time" class="t-label">Time</span>
      <div class="flex items-center justify-between">
        <button class="time text-[28px] leading-9" aria-label="Time, 6:00 AM. Change">6:00<span class="mer">AM</span></button>
        <button class="chip" aria-pressed="false">All-day</button>
      </div>
    </div>

    <div class="sheet-section" role="group" aria-labelledby="lbl-repeat">
      <span id="lbl-repeat" class="t-label">Repeat</span>
      <div class="chip-row">
        <button class="chip" aria-pressed="false">None</button>
        <button class="chip" aria-pressed="false">Daily</button>
        <button class="chip" aria-pressed="false">Weekdays</button>
        <button class="chip" aria-pressed="false">Weekly</button>
        <button class="chip" aria-pressed="false">Monthly</button>
        <button class="chip" aria-pressed="false">Every N days</button>
        <button class="chip" aria-pressed="true">Specific days</button>
      </div>
      <div class="flex justify-between pt-1" aria-label="Days">
        <button class="day" aria-pressed="false" aria-label="Sunday">S</button>
        <button class="day" aria-pressed="true" aria-label="Monday">M</button>
        <button class="day" aria-pressed="false" aria-label="Tuesday">T</button>
        <button class="day" aria-pressed="true" aria-label="Wednesday">W</button>
        <button class="day" aria-pressed="false" aria-label="Thursday">T</button>
        <button class="day" aria-pressed="true" aria-label="Friday">F</button>
        <button class="day" aria-pressed="false" aria-label="Saturday">S</button>
      </div>
    </div>

    <div class="sheet-section" role="group" aria-labelledby="lbl-ends">
      <span id="lbl-ends" class="t-label">Ends</span>
      <div class="chip-row">
        <button class="chip" aria-pressed="true">Never</button>
        <button class="chip" aria-pressed="false">On date</button>
        <button class="chip" aria-pressed="false">After N times</button>
      </div>
    </div>

    <div class="sheet-section" role="group" aria-labelledby="lbl-prio">
      <span id="lbl-prio" class="t-label">Priority</span>
      <div class="segmented is-label" role="radiogroup" aria-labelledby="lbl-prio">
        <button role="radio" aria-checked="false">Low</button>
        <button role="radio" aria-checked="true">Medium</button>
        <button role="radio" aria-checked="false">High</button>
      </div>
    </div>

    <div class="pt-6 flex flex-col items-center gap-3">
      <button class="btn btn-primary">Save todo</button>
      <span class="t-caption t-2">Works offline</span>
    </div>
  </section>
</div>
</body>
</html>
