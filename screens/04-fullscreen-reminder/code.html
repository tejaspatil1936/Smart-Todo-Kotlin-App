<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Reminder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Fullscreen reminder: the app's only all-white screen */
  html, body { background: var(--inv); }
  .alarm { background: var(--inv); color: var(--on-inv); }
  .alarm-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--gap-xl) var(--gutter) 0; }
  .alarm-body .t-label { color: var(--on-inv-2); }
  .alarm-time { margin-top: var(--gap-lg); gap: 6px; }
  .alarm-time .mer { font-size: 28px; opacity: 1; letter-spacing: 0; }
  .alarm-title { margin-top: var(--gap-md); max-width: 100%; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chip-solid { margin-top: var(--gap-md); height: 28px; padding: 0 12px; border-radius: 999px; background: var(--on-inv); color: var(--inv); display: inline-flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .alarm-caption { margin-top: var(--gap-md); color: var(--on-inv-2); white-space: nowrap; }
  .alarm-foot { flex: none; padding: 0 var(--gutter) calc(var(--gap-xl) + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: stretch; }
  .alarm-foot .hint { margin-top: var(--gap-lg); text-align: center; color: var(--on-inv-2); white-space: nowrap; }

  /* SLIDE CONTROL: 72px track, 56px end circles + puck, 8px inset */
  .slide { position: relative; height: 72px; padding: 8px; border-radius: 999px; background: var(--track); display: flex; align-items: center; justify-content: space-between; touch-action: none; user-select: none; }
  .slide-end { position: relative; z-index: 2; width: 56px; height: 56px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--on-inv); transition: opacity var(--press) var(--ease-out); }
  .slide-end.is-later { border: 1.5px solid var(--on-inv); }
  .slide-end.is-done { background: var(--on-inv); color: var(--inv); }
  .slide-end:active { opacity: 0.72; }
  .slide-chev { position: absolute; top: 50%; transform: translateY(-50%); display: inline-flex; color: var(--on-inv-2); opacity: 0.55; z-index: 1; pointer-events: none; }
  .slide-chev .icon { font-size: 18px; width: 12px; overflow: visible; }
  .slide-chev.is-left { left: 76px; }
  .slide-chev.is-right { right: 76px; }
  .slide-puck { position: absolute; z-index: 3; top: 50%; left: 50%; width: 56px; height: 56px; transform: translate(-50%, -50%); border-radius: 999px; background: var(--on-inv); color: var(--inv); display: inline-flex; align-items: center; justify-content: center; cursor: grab; }
  .slide-labels { display: flex; justify-content: space-between; padding: 0 8px; margin-top: var(--gap-sm); }
  .slide-labels span { width: 56px; display: flex; justify-content: center; white-space: nowrap; font-size: 13px; line-height: 18px; }
  .slide-labels .is-later { color: var(--on-inv-2); font-weight: 500; }
  .slide-labels .is-done { color: var(--on-inv); font-weight: 600; }
</style>
</head>
<body class="on-light">
<div class="screen alarm on-light">
  <main class="alarm-body" aria-live="polite">
    <span class="t-label">Todo due</span>
    <span class="time t-display alarm-time">5:00<span class="mer">PM</span></span>
    <h1 class="t-title alarm-title">Project Meeting</h1>
    <span class="chip-solid">High</span>
    <p class="t-caption alarm-caption">Due now · Sat, Aug 23</p>
  </main>

  <div class="alarm-foot">
    <div class="slide">
      <button class="slide-end is-later" aria-label="Remind me later"><span class="icon">snooze</span></button>
      <span class="slide-chev is-left" aria-hidden="true"><span class="icon">chevron_left</span><span class="icon">chevron_left</span><span class="icon">chevron_left</span></span>
      <span class="slide-puck" role="slider" tabindex="0" aria-label="Slide right to finish, left to snooze" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><span class="icon">notifications</span></span>
      <span class="slide-chev is-right" aria-hidden="true"><span class="icon">chevron_right</span><span class="icon">chevron_right</span><span class="icon">chevron_right</span></span>
      <button class="slide-end is-done" aria-label="Done"><span class="icon">check</span></button>
    </div>
    <div class="slide-labels" aria-hidden="true">
      <span class="is-later">Later</span>
      <span class="is-done">Done</span>
    </div>
    <p class="t-caption hint">Slide right to finish · left to snooze</p>
  </div>
</div>
</body>
</html>
