<!DOCTYPE html>

<html class="" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Todo Reminder</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#b8b8b8",
                        "primary": "#ffffff",
                        "on-primary-fixed-variant": "#454747",
                        "outline-variant": "#444748",
                        "secondary-fixed": "#e3e2e2",
                        "secondary": "#c7c6c6",
                        "surface-container-highest": "#353434",
                        "inverse-on-surface": "#313030",
                        "surface-dim": "#141313",
                        "surface-tint": "#c6c6c7",
                        "on-secondary-fixed": "#1a1c1c",
                        "outline": "#8e9192",
                        "on-tertiary-fixed-variant": "#4b4643",
                        "on-primary-fixed": "#1a1c1c",
                        "on-tertiary-container": "#696360",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary": "#2f3131",
                        "tertiary-container": "#eae1dd",
                        "tertiary-fixed-dim": "#cec5c1",
                        "primary-fixed": "#e2e2e2",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed": "#1f1b19",
                        "surface-bright": "#3a3939",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#c6c6c7",
                        "surface-variant": "#353434",
                        "surface": "#141313",
                        "tertiary-fixed": "#eae1dd",
                        "surface-container": "#201f1f",
                        "on-primary": "#2f3131",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#c7c6c6",
                        "tertiary": "#ffffff",
                        "error": "#ffb4ab",
                        "primary-container": "#e2e2e2",
                        "on-tertiary": "#342f2d",
                        "on-surface": "#e5e2e1",
                        "on-primary-container": "#636565",
                        "secondary-container": "#484949",
                        "on-background": "#e5e2e1",
                        "background": "#141313",
                        "error-container": "#93000a",
                        "on-surface-variant": "#c4c7c8",
                        "surface-container-high": "#2a2a2a",
                        "inverse-primary": "#5d5f5f"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "md": "16px",
                        "gutter": "16px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "base": "4px",
                        "xs": "4px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "display": ["Instrument Sans", "sans-serif"],
                        "title-lg": ["Instrument Sans", "sans-serif"],
                        "title-lg-mobile": ["Instrument Sans", "sans-serif"],
                        "heading": ["Instrument Sans", "sans-serif"],
                        "mono-data": ["jetbrainsMono", "monospace"],
                        "label": ["Instrument Sans", "sans-serif"],
                        "body": ["Instrument Sans", "sans-serif"],
                        "caption": ["Instrument Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "title-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "title-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "heading": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "mono-data": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Fluid sizing for large mono time display to respect INK philosophy while achieving requested scale */
        .text-hero-mono {
            font-size: clamp(64px, 15vw, 96px);
            line-height: 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-inverse-surface text-surface font-body antialiased min-h-[884px] flex flex-col justify-between items-center px-margin-mobile py-xl selection:bg-surface selection:text-inverse-surface">
<!-- Top Spacer for vertical balance -->
<div class="flex-none h-12"></div>
<!-- Main Content Area (Centered) -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md text-center">
<!-- Label -->
<span class="font-label text-label text-surface/70 uppercase tracking-[0.2em] mb-lg">
            TODO DUE
        </span>
<!-- Time -->
<div class="flex items-baseline justify-center gap-xs mb-lg flex-nowrap whitespace-nowrap">
<span class="font-mono-data text-hero-mono text-surface font-bold">5:00</span>
<span class="font-mono-data text-heading text-surface">PM</span>
</div>
<!-- Title -->
<h1 class="font-title-lg-mobile text-title-lg-mobile text-surface mb-md">
            Project Meeting
        </h1>
<!-- Chip -->
<div class="inline-flex items-center justify-center px-4 py-1.5 bg-surface rounded-full mb-md">
<span class="font-label text-label text-inverse-surface tracking-widest font-bold">
                High
            </span>
</div>
<!-- Caption -->
<p class="font-caption text-caption text-surface/70">
            Due now · Sat, Aug 23
        </p>
</main>
<!-- Slide Control Area -->
<div class="flex-none w-full max-w-md flex flex-col items-center pb-md">
<!-- Interactive Track -->
<div class="relative w-full h-16 bg-transparent rounded-full flex items-center justify-between px-2 border border-surface/30 overflow-hidden group select-none touch-none">
<!-- Filled Track Progress -->
<div class="absolute inset-y-0 left-0 right-2 bg-surface/10 rounded-full z-0"></div>
<!-- Left Snooze Action -->
<div class="w-12 h-12 rounded-full border border-surface/50 flex items-center justify-center bg-transparent shrink-0 relative z-10 transition-colors opacity-50 group-active:border-surface">
<span class="material-symbols-outlined text-surface group-active:text-surface transition-colors text-[20px]">snooze</span>
</div>
<!-- Left Chevrons -->
<div class="absolute left-[72px] flex items-center text-surface/50 -space-x-2 z-10">
<span class="material-symbols-outlined text-[16px]">chevron_left</span>
<span class="material-symbols-outlined text-[16px]">chevron_left</span>
<span class="material-symbols-outlined text-[16px]">chevron_left</span>
</div>
<!-- Draggable Center Puck (Dragged to Right) -->
<div class="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-surface flex items-center justify-center z-20 cursor-grab active:cursor-grabbing hover:scale-105 active:scale-95 transition-transform shadow-lg">
<span class="material-symbols-outlined text-inverse-surface fill text-[20px]">notifications</span>
</div>
<!-- Right Chevrons -->
<div class="absolute right-[72px] flex items-center text-surface/50 -space-x-2 z-10">
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</div>
<!-- Right Done Action -->
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center shrink-0 relative z-10 opacity-90 hover:opacity-100 transition-opacity hidden">
<span class="material-symbols-outlined text-inverse-surface font-bold text-[20px]">check</span>
</div>
</div>
<!-- Action Labels -->
<div class="w-full flex justify-between px-4 mt-sm">
<span class="font-caption text-caption text-surface/50 opacity-100">Later</span>
<span class="font-caption text-caption text-surface font-bold">Done</span>
</div>
<!-- Instructional Caption -->
<p class="font-caption text-caption text-surface/70 mt-lg">
            Release to mark done
        </p>
</div>
</body></html>
