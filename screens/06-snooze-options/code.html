<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-body relative bg-surface-bright text-inverse-on-surface">
<!-- Background Content (Dimmed) -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-mobile z-0">
<div class="text-center">
<h1 class="font-display text-display mb-sm">DSA</h1>
<p class="font-mono-data text-mono-data">Due 7:00 <span class="text-[10px]">PM</span></p>
</div>
</main>
<!-- Scrim -->
<div class="absolute inset-0 bg-black/60 z-10 transition-opacity duration-300"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 right-0 bg-surface-container text-on-surface z-20 rounded-t-[32px] transform transition-transform duration-300 translate-y-0">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-md pb-xs">
<div class="w-12 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-margin-mobile pt-sm pb-md">
<h2 class="font-heading text-heading">Remind me in</h2>
</div>
<!-- Options List -->
<div class="flex flex-col">
<!-- Row 1 -->
<button class="flex items-center justify-between px-margin-mobile py-lg border-t border-surface-variant w-full text-left transition-colors hover:bg-surface-variant">
<span class="font-body text-body font-medium">15 minutes</span>
<span class="font-mono-data text-mono-data text-on-surface-variant tracking-tight">7:15 <span class="text-[10px]">PM</span></span>
</button>
<!-- Row 2 (Pressed / Inverted) -->
<button class="flex items-center justify-between px-margin-mobile py-lg border-t border-surface-variant w-full text-left bg-primary text-surface">
<span class="font-body text-body font-medium">30 minutes</span>
<span class="font-mono-data text-mono-data tracking-tight text-surface-variant">7:30 <span class="text-[10px]">PM</span></span>
</button>
<!-- Row 3 -->
<button class="flex items-center justify-between px-margin-mobile py-lg border-t border-surface-variant w-full text-left transition-colors hover:bg-surface-variant">
<span class="font-body text-body font-medium">1 hour</span>
<span class="font-mono-data text-mono-data text-on-surface-variant tracking-tight">8:00 <span class="text-[10px]">PM</span></span>
</button>
<!-- Row 4 -->
<button class="flex items-center justify-between px-margin-mobile py-lg border-t border-surface-variant w-full text-left pb-[calc(24px+env(safe-area-inset-bottom))] transition-colors hover:bg-surface-variant">
<span class="font-body text-body font-medium">2 hours</span>
<span class="font-mono-data text-mono-data text-on-surface-variant tracking-tight">9:00 <span class="text-[10px]">PM</span></span>
</button>
</div>
</div>
</body></html>
