<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Remind me in</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* The all-white fullscreen reminder, behind the scrim */
  .alarm { background: var(--inv); color: var(--on-inv); flex: 1; display: flex; flex-direction: column; align-items: center; padding: 160px var(--gutter) 0; text-align: center; }
  .alarm .t-label { color: var(--on-inv-2); }
  .alarm .time { margin-top: var(--gap-lg); font-size: 88px; }
  .alarm .time .mer { font-size: 24px; opacity: 1; }
  .alarm .t-title { margin-top: var(--gap-md); }

  /* Snooze option row: duration left, resulting time right; full-bleed inside the sheet */
  .snooze-list { margin: 0 calc(-1 * var(--gutter)); }
  .snooze-opt { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); width: 100%; min-height: var(--row); padding: 0 var(--gutter); text-align: left; position: relative; color: var(--text-1); transition: background-color var(--press) var(--ease-out); }
  .snooze-opt + .snooze-opt::before { content: ""; position: absolute; top: 0; left: var(--gutter); right: var(--gutter); height: 1px; background: var(--hairline); }
  .snooze-opt .time { color: var(--text-2); font-size: 15px; }
  .snooze-opt:active, .snooze-opt.is-pressed { background: var(--inv); color: var(--on-inv); }
  .snooze-opt.is-pressed .time { color: var(--on-inv); }
  .snooze-opt.is-pressed::before, .snooze-opt.is-pressed + .snooze-opt::before { display: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="alarm" aria-hidden="true">
    <span class="t-label">Todo due</span>
    <span class="time">7:00<span class="mer">PM</span></span>
    <span class="t-title">DSA</span>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="sheet-title" class="sheet-title">Remind me in</h2>
    <div class="snooze-list">
      <button class="snooze-opt"><span class="w-medium">15 minutes</span><span class="time">7:15<span class="mer">PM</span></span></button>
      <button class="snooze-opt is-pressed"><span class="w-medium">30 minutes</span><span class="time">7:30<span class="mer">PM</span></span></button>
      <button class="snooze-opt"><span class="w-medium">1 hour</span><span class="time">8:00<span class="mer">PM</span></span></button>
      <button class="snooze-opt"><span class="w-medium">2 hours</span><span class="time">9:00<span class="mer">PM</span></span></button>
    </div>
  </section>
</div>
</body>
</html>
