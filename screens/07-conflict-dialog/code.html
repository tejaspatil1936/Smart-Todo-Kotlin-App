<body class="bg-background text-on-surface antialiased h-screen w-screen overflow-hidden flex flex-col font-body text-body">
<!-- Mock Background (Dimmed) -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" data-alt="A dark, minimalist home screen of a productivity application. The interface is blurred and barely visible, rendered in deep blacks and stark whites. The mood is highly focused and austere. A subtle grain texture is present." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBjBZegEUsu2lRl6FKT1FmiN7sqkwYzioekI8_yLNZtbAeBw9BO3vx26sQi21rEIZOVir8apyogntzCu9P2VcikRtvfTKD81xGOMfM_ZP4E3Q9jsJX76u7MTXdRvzwnVYFkN_-Gu5SdeFBu32KmFh1hRaMcrGznsXNdjKWkx00SvX0UuUCQXBcL2-G3L6CZ4-ZznGCcEAsLdqDQjVogTLk9PmtQ3OalfrbtSHldZifwezLHC14vK5Na8A'); background-size: cover; background-position: center;">
</div>
<!-- Dialog Overlay Container -->
<div class="absolute inset-0 z-10 flex items-center justify-center p-margin-mobile bg-black/80 backdrop-blur-sm">
<!-- Dialog Box -->
<div class="bg-surface-container-high rounded-xl w-full max-w-sm flex flex-col border border-surface-variant shadow-2xl overflow-hidden">
<!-- Header -->
<div class="flex flex-col gap-xs pt-lg px-lg pb-md">
<h2 class="font-heading text-heading text-primary">Time conflict</h2>
<p class="font-mono-data text-mono-data text-on-surface-variant">5:00 PM · today</p>
</div>
<!-- Content Rows -->
<div class="flex flex-col border-y border-surface-variant">
<!-- Row 1: Existing -->
<div class="flex items-center px-lg py-md gap-md">
<div class="w-20 shrink-0">
<span class="font-mono-data text-mono-data text-on-surface-variant">5:00 PM</span>
</div>
<div class="flex-1 truncate">
<span class="font-body text-body text-primary font-medium">Project Meeting</span>
</div>
<div class="shrink-0">
<span class="inline-flex items-center justify-center px-2 py-1 rounded-full border border-surface-variant font-label text-label text-on-surface-variant">existing</span>
</div>
</div>
<div class="h-px bg-surface-variant mx-lg"></div>
<!-- Row 2: New -->
<div class="flex items-center px-lg py-md gap-md">
<div class="w-20 shrink-0">
<span class="font-mono-data text-mono-data text-on-surface-variant">5:00 PM</span>
</div>
<div class="flex-1 truncate">
<span class="font-body text-body text-primary font-medium">Gym</span>
</div>
<div class="shrink-0">
<span class="inline-flex items-center justify-center px-2 py-1 rounded-full border border-surface-variant font-label text-label text-on-surface-variant">new</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col p-lg gap-sm">
<button class="w-full flex items-center justify-center py-3 px-4 rounded-full border border-surface-variant bg-transparent text-primary font-label text-label tracking-widest active:scale-95 transition-transform hover:bg-surface-variant/50">
          Keep both
        </button>
<button class="w-full flex items-center justify-center py-3 px-4 rounded-full bg-white text-surface-dim font-label text-label tracking-widest active:scale-95 transition-transform hover:opacity-90">
          Move new task
        </button>
<button class="w-full flex items-center justify-center py-3 px-4 bg-transparent text-on-surface-variant font-label text-label tracking-widest active:scale-95 transition-transform hover:text-primary mt-sm">
          Cancel
        </button>
</div>
<!-- Footer -->
<div class="pb-lg px-lg text-center">
<p class="font-caption text-caption text-on-surface-variant">Suggests the next free slot — <span class="font-mono-data">5:30 PM</span></p>
</div>
</div>
