<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Time conflict</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Conflict mini row: fixed time rail so both times align, title, small outlined chip */
  .mini-row { display: flex; align-items: center; min-height: 56px; gap: var(--gap-sm); }
  .mini-row + .mini-row { border-top: 1px solid var(--hairline); }
  .mini-row .rail { width: 64px; flex: none; color: var(--text-2); font-size: 15px; }
  .mini-row .title { flex: 1; min-width: 0; font-weight: 500; }
  .btn-text.t-2 { color: var(--text-2); }
  .chip-xs { height: 24px; padding: 0 8px; font-size: 12px; line-height: 16px; }
</style>
</head>
<body>
<div class="screen">
  <!-- Home, behind the scrim -->
  <div aria-hidden="true">
    <div class="statusbar"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>
    <header class="page-head">
      <div class="row"><span class="t-label t-2">Today</span><span class="t-mono t-caption t-2">4 LEFT</span></div>
      <div class="row"><span class="t-title">Sat, Aug 23</span><span class="icon t-2">cloud_done</span></div>
    </header>
    <div class="gutter">
      <div class="section-head"><span class="t-label">Today</span><span class="count">4</span></div>
      <div class="todo-row"><div class="rail"><span class="time">5:00<span class="mer">PM</span></span></div><div class="main"><span class="title">Project Meeting</span></div><span class="check"></span></div>
      <div class="todo-row"><div class="rail"><span class="time">7:00<span class="mer">PM</span></span></div><div class="main"><span class="title">DSA</span></div><span class="check"></span></div>
      <div class="todo-row"><div class="rail"><span class="time">9:00<span class="mer">PM</span></span></div><div class="main"><span class="title">Read</span></div><span class="check"></span></div>
    </div>
  </div>
  <div class="scrim"></div>

  <section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-sub">
    <h2 id="dlg-title" class="t-heading">Time conflict</h2>
    <p id="dlg-sub" class="t-mono t-2 mt-1"><span class="time">5:00<span class="mer">PM</span></span> · today</p>

    <div class="mt-4 border-y border-hairline">
      <div class="mini-row">
        <span class="rail"><span class="time">5:00<span class="mer">PM</span></span></span>
        <span class="title truncate">Project Meeting</span>
        <span class="chip chip-xs">existing</span>
      </div>
      <div class="mini-row">
        <span class="rail"><span class="time">5:00<span class="mer">PM</span></span></span>
        <span class="title truncate">Gym</span>
        <span class="chip chip-xs">new</span>
      </div>
    </div>

    <div class="btn-stack mt-6">
      <button class="btn btn-outline">Keep both</button>
      <button class="btn btn-primary">Move new task</button>
      <button class="btn btn-text t-2">Cancel</button>
    </div>
    <p class="t-caption t-2 mt-4 nowrap">Suggests the next free slot — <span class="time">5:30<span class="mer">PM</span></span></p>
  </section>
</div>
</body>
</html>
