<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — History</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Missed count: inverted against the unselected (dark) segment */
  .segmented > button[aria-selected="false"] .badge { background: var(--inv); color: var(--on-inv); }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <main class="screen-scroll">
    <header class="page-head">
      <div class="row"><h1 class="t-label t-2">History</h1></div>
    </header>

    <div class="gutter pt-2">
      <div class="segmented" role="tablist" aria-label="History filter">
        <button role="tab" aria-selected="true">Completed</button>
        <button role="tab" aria-selected="false">Missed<span class="badge" aria-label="2 missed">2</span></button>
      </div>
    </div>

    <div class="gutter pb-6">
      <section aria-labelledby="d-sat">
        <div class="section-head"><h2 id="d-sat" class="t-label">Sat, Aug 23</h2><span class="count">2</span></div>
        <div class="todo-row is-done">
          <div class="rail"><span class="time">7:00<span class="mer">PM</span></span></div>
          <div class="main"><span class="title truncate">DSA</span></div>
          <button class="check is-checked" aria-label="DSA completed. Mark not done"><span class="icon">check</span></button>
        </div>
        <div class="todo-row is-done">
          <div class="rail"><span class="time">5:00<span class="mer">PM</span></span></div>
          <div class="main"><span class="title truncate">Project Meeting</span></div>
          <button class="check is-checked" aria-label="Project Meeting completed. Mark not done"><span class="icon">check</span></button>
        </div>
      </section>

      <section aria-labelledby="d-fri">
        <div class="section-head"><h2 id="d-fri" class="t-label">Fri, Aug 22</h2><span class="count">3</span></div>
        <div class="todo-row is-done">
          <div class="rail"><span class="time">8:00<span class="mer">PM</span></span></div>
          <div class="main"><span class="title truncate">Leetcode</span></div>
          <button class="check is-checked" aria-label="Leetcode completed. Mark not done"><span class="icon">check</span></button>
        </div>
        <div class="todo-row is-done">
          <div class="rail"><span class="time">6:00<span class="mer">AM</span></span></div>
          <div class="main"><span class="title truncate">Gym</span></div>
          <button class="check is-checked" aria-label="Gym completed. Mark not done"><span class="icon">check</span></button>
        </div>
        <div class="todo-row is-done">
          <div class="rail"><span class="time">9:00<span class="mer">AM</span></span></div>
          <div class="main"><span class="title truncate">Standup</span></div>
          <button class="check is-checked" aria-label="Standup completed. Mark not done"><span class="icon">check</span></button>
        </div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="#"><span class="dot"></span><span class="icon">calendar_today</span>Today</a>
    <a href="#" aria-current="page"><span class="dot"></span><span class="icon">history</span>History</a>
    <a href="#"><span class="dot"></span><span class="icon">layers</span>Rooms</a>
    <a href="#"><span class="dot"></span><span class="icon">settings</span>Settings</a>
  </nav>
</div>
</body>
</html>
