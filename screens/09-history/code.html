<h1 class="font-label text-label text-on-surface-variant uppercase mb-lg tracking-widest mt-md">HISTORY</h1>

<div class="flex w-full bg-surface-raised p-1 rounded-full mb-xl">
<button class="flex-1 bg-inverted-surface text-ground font-label text-label py-sm rounded-full text-center transition-all">
                Completed
            </button>
<button class="flex-1 text-primary font-label text-label py-sm rounded-full text-center flex items-center justify-center gap-xs transition-all opacity-60">
                Missed
                <span class="bg-inverted-surface text-ground text-[10px] px-1.5 py-0.5 rounded-full leading-none">2</span>
</button>
</div>
<!-- History List -->
<div class="flex flex-col gap-0 opacity-50">
<!-- Section: SAT, AUG 23 -->
<div class="flex justify-between items-end pb-sm pt-md border-b border-hairline">
<span class="font-label text-label text-on-surface-variant uppercase tracking-widest">SAT, AUG 23</span>
<span class="font-mono-data text-mono-data text-on-surface-variant">2</span>
</div>
<!-- Todo Row -->
<div class="flex items-center py-md border-b border-hairline group">
<div class="time-rail flex items-baseline text-on-surface-variant font-mono-data text-mono-data">

</div>
<div class="flex-1 line-through text-on-surface-variant font-body text-body">
                    DSA
                </div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'wght' 200;">check</span>
</div>
<!-- Todo Row -->
<div class="flex items-center py-md border-b border-hairline group">
<div class="time-rail flex items-baseline text-on-surface-variant font-mono-data text-mono-data">
                    5:00<span class="am-pm uppercase">PM</span>
</div>
<div class="flex-1 line-through text-on-surface-variant font-body text-body">

                </div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'wght' 200;">check</span>
</div>

<span class="font-mono-data text-mono-data text-on-surface-variant">3</span>

<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'wght' 200;">check</span>
</div>

</div>
<div class="flex-1 line-through text-on-surface-variant font-body text-body">

                </div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'wght' 200;">check</span>
</div>

<div class="flex-1 line-through text-on-surface-variant font-body text-body">
