<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Rooms</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Room card: whole card is the tap target; chevron sits on the inner padding edge */
  .room-card { display: flex; align-items: center; gap: var(--gap-md); width: 100%; text-align: left; transition: background-color var(--press) var(--ease-out); }
  .room-card:active { background: var(--raised); }
  .room-card .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap-sm); }
  .room-card .chev { color: var(--text-2); font-size: 20px; margin-right: -4px; }
  .avatar-stack .avatar { width: 28px; height: 28px; font-size: 12px; }
  /* Empty-slot hint */
  .room-hint { display: flex; align-items: center; justify-content: center; min-height: 88px; padding: var(--gap-md); border: 1px dashed var(--stroke); border-radius: var(--card-r); color: var(--text-2); text-align: center; width: 100%; }
  .room-hint:active { background: var(--surface); }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <header class="appbar">
    <h1 class="t-label t-2">Rooms</h1>
    <button class="icon-btn" aria-label="Create room"><span class="icon">add</span></button>
  </header>

  <main class="screen-scroll">
    <div class="gutter pt-2 pb-6 flex flex-col gap-3">
      <button class="card room-card" aria-label="Project Room, 3 open, 1 due today">
        <div class="main">
          <span class="t-heading">Project Room</span>
          <span class="avatar-stack" aria-hidden="true"><span class="avatar">T</span><span class="avatar">R</span><span class="avatar">A</span></span>
          <span class="t-body nowrap"><span class="t-2">3 open</span><span class="t-2 mx-1.5" aria-hidden="true">·</span><span class="w-semibold">1 due today</span></span>
        </div>
        <span class="icon chev" aria-hidden="true">chevron_right</span>
      </button>

      <button class="card room-card" aria-label="Study Group, 2 open">
        <div class="main">
          <span class="t-heading">Study Group</span>
          <span class="avatar-stack" aria-hidden="true"><span class="avatar">S</span><span class="avatar">K</span></span>
          <span class="t-body t-2 nowrap">2 open</span>
        </div>
        <span class="icon chev" aria-hidden="true">chevron_right</span>
      </button>

      <button class="room-hint t-body">Create a room to share todos</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="#"><span class="dot"></span><span class="icon">calendar_today</span>Today</a>
    <a href="#"><span class="dot"></span><span class="icon">history</span>History</a>
    <a href="#" aria-current="page"><span class="dot"></span><span class="icon">layers</span>Rooms</a>
    <a href="#"><span class="dot"></span><span class="icon">settings</span>Settings</a>
  </nav>
</div>
</body>
</html>
