<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            background-color: #0C0C0C; /* Explicitly requested background */
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="text-on-background font-body antialiased min-h-screen flex flex-col pt-4 pb-[80px]">
<!-- Status Bar / Header -->
<header class="w-full top-0 bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant flex items-center justify-between px-margin-mobile py-sm mb-lg">
<h1 class="font-label text-label uppercase tracking-widest text-on-surface-variant dark:text-on-surface-variant">ROOMS</h1>
<button class="text-primary hover:bg-surface-variant transition-colors p-2 rounded-full flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 300;">add</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile flex flex-col gap-sm md:max-w-2xl md:mx-auto md:w-full">
<!-- Room Card 1 -->
<article class="bg-surface-container rounded-DEFAULT border border-[#262626] p-md flex items-center justify-between cursor-pointer hover:bg-surface-variant transition-colors group">
<div class="flex flex-col gap-xs">
<h2 class="font-heading text-heading font-semibold text-primary">Project Room</h2>
<!-- Avatar Row -->
<div class="flex items-center -space-x-2 my-1">
<div class="w-8 h-8 rounded-full bg-surface-bright border-2 border-surface-container flex items-center justify-center text-primary font-mono-data text-[10px] z-30">T</div>
<div class="w-8 h-8 rounded-full bg-surface-bright border-2 border-surface-container flex items-center justify-center text-primary font-mono-data text-[10px] z-20">R</div>
<div class="w-8 h-8 rounded-full bg-surface-bright border-2 border-surface-container flex items-center justify-center text-primary font-mono-data text-[10px] z-10">A</div>
</div>
<!-- Meta -->
<div class="flex items-center gap-2 mt-1">
<span class="font-body text-body text-on-surface-variant">3 open</span>
<span class="text-on-surface-variant">·</span>
<span class="font-body text-body font-semibold text-primary">1 due today</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0, 'wght' 300;">chevron_right</span>
</article>
<!-- Room Card 2 -->
<article class="bg-surface-container rounded-DEFAULT border border-[#262626] p-md flex items-center justify-between cursor-pointer hover:bg-surface-variant transition-colors group">
<div class="flex flex-col gap-xs">
<h2 class="font-heading text-heading font-semibold text-primary">Study Group</h2>
<!-- Avatar Row -->
<div class="flex items-center -space-x-2 my-1">
<div class="w-8 h-8 rounded-full bg-surface-bright border-2 border-surface-container flex items-center justify-center text-primary font-mono-data text-[10px] z-20">S</div>
<div class="w-8 h-8 rounded-full bg-surface-bright border-2 border-surface-container flex items-center justify-center text-primary font-mono-data text-[10px] z-10">K</div>
</div>
<!-- Meta -->
<div class="flex items-center gap-2 mt-1">
<span class="font-body text-body text-on-surface-variant">2 open</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0, 'wght' 300;">chevron_right</span>
</article>
<!-- Empty Slot Hint -->
<button class="w-full mt-sm py-xl rounded-DEFAULT border-2 border-dashed border-[#262626] flex items-center justify-center hover:bg-surface-container-low transition-colors group cursor-pointer">
<span class="font-body text-body text-on-surface-variant group-hover:text-primary transition-colors">Create a room to share todos</span>
</button>
</main>
<!-- Bottom Navigation Shell -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center py-md bg-background border-t border-outline-variant z-50">
<!-- Today (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 tap-highlight-none active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">calendar_today</span>
<span class="font-label text-label">Today</span>
</a>
<!-- History (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 tap-highlight-none active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label text-label">History</span>
</a>
<!-- Rooms (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary px-4 py-1 hover:opacity-80 tap-highlight-none active:scale-90 transition-all relative" href="#">
<div class="w-1 h-1 rounded-full bg-primary absolute top-0"></div>
<span class="material-symbols-outlined mb-1 mt-2" style="font-variation-settings: 'FILL' 1;">layers</span>
<span class="font-label text-label">Rooms</span>
</a>
<!-- Settings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:opacity-80 tap-highlight-none active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label text-label">Settings</span>
</a>
</nav>
