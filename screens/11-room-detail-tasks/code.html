<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Project Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Member row: equal gaps; a role label centers under its avatar without widening the column */
  .members { display: flex; gap: 12px; padding: var(--gap-md) var(--gutter) var(--gap-md); }
  .member { position: relative; display: flex; flex-direction: column; align-items: center; width: 40px; }
  .member .role { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 12px; color: var(--text-2); }
  .members.has-role { padding-bottom: 32px; }
  .todo-row .meta .avatar { margin-right: 2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <header class="appbar">
    <button class="icon-btn" aria-label="Back"><span class="icon">arrow_back</span></button>
    <button class="icon-btn" aria-label="More options"><span class="icon">more_vert</span></button>
  </header>

  <h1 class="t-title gutter pt-1">Project Room</h1>

  <ul class="members has-role" aria-label="Members">
    <li class="member"><span class="avatar" aria-hidden="true">T</span><span class="role t-label">Admin</span><span class="sr-only">Tejas, admin</span></li>
    <li class="member"><span class="avatar" aria-hidden="true">R</span><span class="sr-only">Rahul</span></li>
    <li class="member"><span class="avatar" aria-hidden="true">A</span><span class="sr-only">Amit</span></li>
  </ul>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true">Tasks</button>
    <button role="tab" aria-selected="false">Activity</button>
  </div>

  <main class="screen-scroll">
    <div class="gutter pb-6">
      <div class="todo-row">
        <div class="rail"><span class="time">5:00<span class="mer">PM</span></span></div>
        <div class="main">
          <span class="title truncate">Build API</span>
          <span class="meta"><span class="avatar avatar-sm" aria-hidden="true">T</span>Tejas</span>
        </div>
        <button class="check" aria-label="Mark Build API done"></button>
      </div>
      <div class="todo-row">
        <div class="rail"><span class="time">7:00<span class="mer">PM</span></span></div>
        <div class="main">
          <span class="title truncate">Build UI</span>
          <span class="meta"><span class="avatar avatar-sm" aria-hidden="true">R</span>Rahul<span aria-hidden="true">·</span><span class="t-1 w-medium">due soon</span></span>
        </div>
        <button class="check" aria-label="Mark Build UI done"></button>
      </div>
      <div class="todo-row">
        <div class="rail"><span class="t-label" aria-label="Tomorrow">TMRW</span></div>
        <div class="main">
          <span class="title truncate">Testing</span>
          <span class="meta"><span class="avatar avatar-sm" aria-hidden="true">A</span>Amit</span>
        </div>
        <button class="check" aria-label="Mark Testing done"></button>
      </div>
    </div>
  </main>

  <div class="dock">
    <div class="dock-inner">
      <form class="composer" onsubmit="return false">
        <button type="button" class="icon-btn" aria-label="Open manual add form"><span class="icon">add</span></button>
        <label for="room-input" class="sr-only">Add a shared todo</label>
        <input id="room-input" type="text" placeholder="Add a shared todo…" autocomplete="off"/>
        <button type="submit" class="send" aria-label="Send"><span class="icon">arrow_upward</span></button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
