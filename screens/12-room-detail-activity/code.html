<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Project Room · Activity</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Member row: equal gaps; a role label centers under its avatar without widening the column */
  .members { display: flex; gap: 12px; padding: var(--gap-md) var(--gutter) var(--gap-md); }
  .member { position: relative; display: flex; flex-direction: column; align-items: center; width: 40px; }
  .member .role { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 12px; color: var(--text-2); }
  .members.has-role { padding-bottom: 32px; }

  /* Activity timeline: mono rail | node | text. The connector runs between
     node centers only, so it starts at the first entry and stops at the last. */
  .timeline { list-style: none; margin: 0; padding-top: var(--gap-sm); }
  .tl-row { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; }
  .tl-row .rail { width: 76px; flex: none; font-size: 13px; line-height: 22px; color: var(--text-2); }
  .tl-row .node { position: relative; z-index: 1; width: 24px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; }
  .tl-row .node .avatar { box-shadow: 0 0 0 4px var(--ground); }
  .tl-row .node .icon { font-size: 18px; color: var(--text-2); background: var(--ground); }
  .tl-row .text { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; color: var(--text-1); }
  /* node center = 13px padding + 11px half-height; draw to the next row's node center */
  .tl-row:not(:last-child)::after { content: ""; position: absolute; left: calc(76px + 12px + 11.5px); width: 1px; top: 24px; bottom: -24px; background: var(--stroke); }
  .tl-row.is-done .rail, .tl-row.is-done .text { opacity: 0.4; }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <header class="appbar">
    <button class="icon-btn" aria-label="Back"><span class="icon">arrow_back</span></button>
    <button class="icon-btn" aria-label="More options"><span class="icon">more_vert</span></button>
  </header>

  <h1 class="t-title gutter pt-1">Project Room</h1>

  <ul class="members has-role" aria-label="Members">
    <li class="member"><span class="avatar" aria-hidden="true">T</span><span class="role t-label">Admin</span><span class="sr-only">Tejas, admin</span></li>
    <li class="member"><span class="avatar" aria-hidden="true">R</span><span class="sr-only">Rahul</span></li>
    <li class="member"><span class="avatar" aria-hidden="true">A</span><span class="sr-only">Amit</span></li>
  </ul>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="false">Tasks</button>
    <button role="tab" aria-selected="true">Activity</button>
  </div>

  <main class="screen-scroll">
    <ol class="timeline gutter pb-6" aria-label="Room activity">
      <li class="tl-row">
        <span class="rail time">10:32<span class="mer">AM</span></span>
        <span class="node"><span class="avatar avatar-sm" aria-hidden="true">R</span></span>
        <span class="text">Rahul created 'Build UI'</span>
      </li>
      <li class="tl-row">
        <span class="rail time">10:45<span class="mer">AM</span></span>
        <span class="node"><span class="avatar avatar-sm" aria-hidden="true">R</span></span>
        <span class="text">Rahul assigned it to Tejas</span>
      </li>
      <li class="tl-row">
        <span class="rail time">11:20<span class="mer">AM</span></span>
        <span class="node"><span class="avatar avatar-sm" aria-hidden="true">T</span></span>
        <span class="text">Tejas changed the deadline to <span class="time">6:00<span class="mer">PM</span></span></span>
      </li>
      <li class="tl-row is-done">
        <span class="rail time">5:48<span class="mer">PM</span></span>
        <span class="node"><span class="icon" aria-hidden="true">check</span></span>
        <span class="text">Tejas completed 'Build UI'</span>
      </li>
    </ol>
  </main>
</div>
</body>
</html>
