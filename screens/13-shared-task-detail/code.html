<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Shared task</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Comment block: small avatar | name + time line, wrapped text under the name */
  .comment { display: flex; gap: 12px; }
  .comment .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .comment .who { display: flex; align-items: baseline; gap: var(--gap-sm); }
  /* Composer without a leading + button: text starts at the pill's inner padding */
  .composer.no-lead input { padding-left: 16px; }
</style>
</head>
<body>
<div class="screen">
  <!-- Room detail, behind the scrim -->
  <div aria-hidden="true">
    <div class="statusbar"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>
    <div class="appbar"><span class="icon-btn"><span class="icon">arrow_back</span></span><span class="icon-btn"><span class="icon">more_vert</span></span></div>
    <div class="gutter"><span class="t-title">Project Room</span></div>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="task-title">
    <div class="sheet-handle" aria-hidden="true"></div>

    <div class="flex items-center justify-between">
      <h2 id="task-title" class="t-heading">Build UI</h2>
      <button class="check" aria-label="Mark Build UI complete"></button>
    </div>

    <dl class="mt-2">
      <div class="list-row">
        <dt class="main t-body t-2">Assignee</dt>
        <dd class="value w-medium"><span class="avatar avatar-sm" aria-hidden="true">R</span>Rahul</dd>
      </div>
      <div class="list-row">
        <dt class="main t-body t-2">Due</dt>
        <dd class="value w-medium">Today · <span class="time">7:00<span class="mer">PM</span></span></dd>
      </div>
      <div class="list-row">
        <dt class="main t-body t-2">Repeat</dt>
        <dd class="value w-medium">None</dd>
      </div>
      <div class="list-row">
        <dt class="main t-body t-2">Priority</dt>
        <dd class="value w-medium">Medium</dd>
      </div>
    </dl>

    <h3 class="t-label t-2 pt-8 pb-4">Comments</h3>
    <ul class="flex flex-col gap-5">
      <li class="comment">
        <span class="avatar avatar-sm" aria-hidden="true">T</span>
        <div class="body">
          <div class="who"><span class="t-caption w-semibold">Tejas</span><span class="time t-caption t-2">10:50<span class="mer">AM</span></span></div>
          <p class="t-body t-2">Keep it strictly monochrome like the mockups.</p>
        </div>
      </li>
      <li class="comment">
        <span class="avatar avatar-sm" aria-hidden="true">R</span>
        <div class="body">
          <div class="who"><span class="t-caption w-semibold">Rahul</span><span class="time t-caption t-2">11:02<span class="mer">AM</span></span></div>
          <p class="t-body t-2">On it — pushing a draft tonight.</p>
        </div>
      </li>
    </ul>

    <div class="flex flex-col gap-3 pt-8">
      <button class="btn btn-primary">Mark complete</button>
      <form class="composer no-lead" onsubmit="return false">
        <label for="comment-input" class="sr-only">Add a comment</label>
        <input id="comment-input" type="text" placeholder="Add a comment…" autocomplete="off"/>
        <button type="submit" class="send" aria-label="Send comment"><span class="icon">arrow_upward</span></button>
      </form>
    </div>
  </section>
</div>
</body>
</html>
