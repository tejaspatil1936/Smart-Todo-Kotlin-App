<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — New room</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Invite code: large letterspaced mono */
  .invite-code { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="screen">
  <!-- Rooms, behind the scrim -->
  <div aria-hidden="true">
    <div class="statusbar"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>
    <header class="page-head"><div class="row"><span class="t-label t-2">Rooms</span><span class="icon">add</span></div></header>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="sheet-title" class="sheet-title">New room</h2>

    <div class="field">
      <label for="room-name" class="t-label">Room name</label>
      <input id="room-name" class="input" type="text" value="Project Room"/>
    </div>

    <div class="sheet-section">
      <span id="lbl-invite" class="t-label">Invite</span>
      <div class="flex items-center justify-between" aria-labelledby="lbl-invite">
        <span class="invite-code">TDQ-482</span>
        <button class="icon-btn -mr-3" aria-label="Copy invite code"><span class="icon">content_copy</span></button>
      </div>
      <button class="btn btn-outline"><span class="icon" aria-hidden="true">share</span>Share invite link</button>
    </div>

    <div class="sheet-section">
      <span id="lbl-members" class="t-label">Members</span>
      <ul aria-labelledby="lbl-members">
        <li class="list-row">
          <span class="avatar" aria-hidden="true">T</span>
          <span class="main"><span class="t-body truncate">Tejas <span class="t-caption t-2">— Admin (you)</span></span></span>
        </li>
        <li class="list-row">
          <span class="avatar" aria-hidden="true">R</span>
          <span class="main t-body truncate">Rahul</span>
          <button class="icon-btn t-2 -mr-3" aria-label="Remove Rahul"><span class="icon">remove</span></button>
        </li>
        <li class="list-row">
          <span class="avatar" aria-hidden="true">A</span>
          <span class="main t-body truncate">Amit</span>
          <button class="icon-btn t-2 -mr-3" aria-label="Remove Amit"><span class="icon">remove</span></button>
        </li>
      </ul>
    </div>

    <div class="pt-6">
      <button class="btn btn-primary">Create room</button>
    </div>
  </section>
</div>
</body>
</html>
