<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Attention dot after a row label (permission not fully granted) */
  .attn-dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--text-1); margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <main class="screen-scroll">
    <header class="page-head">
      <div class="row"><h1 class="t-label t-1">Settings</h1></div>
    </header>

    <div class="gutter pb-6">
      <section aria-labelledby="sec-account">
        <div class="section-head"><h2 id="sec-account" class="t-label">Account</h2></div>
        <button class="list-row border-b-0">
          <span class="avatar avatar-lg" aria-hidden="true">T</span>
          <span class="main">
            <span class="t-body w-medium truncate">Tejas</span>
            <span class="t-caption t-2 truncate">tejas@gmail.com</span>
          </span>
          <span class="icon chev" aria-hidden="true">chevron_right</span>
        </button>
        <button class="btn-text t-body text-muted flex items-center">Sign out</button>
      </section>

      <section aria-labelledby="sec-reminders">
        <div class="section-head"><h2 id="sec-reminders" class="t-label">Reminders</h2></div>
        <div class="list-row">
          <span class="main">
            <span id="quiet-label" class="t-body">Quiet reminders</span>
            <span id="quiet-hint" class="t-caption t-2 truncate">Won't override silent or Do Not Disturb</span>
          </span>
          <button class="switch" role="switch" aria-checked="false" aria-labelledby="quiet-label" aria-describedby="quiet-hint"></button>
        </div>
        <button class="list-row">
          <span class="main t-body">Morning default</span>
          <span class="value"><span class="time text-muted">9:00<span class="mer">AM</span></span><span class="icon chev" aria-hidden="true">chevron_right</span></span>
        </button>
        <button class="list-row">
          <span class="main t-body">Evening default</span>
          <span class="value"><span class="time text-muted">6:00<span class="mer">PM</span></span><span class="icon chev" aria-hidden="true">chevron_right</span></span>
        </button>
        <button class="list-row">
          <span class="main t-body">All-day reminder</span>
          <span class="value"><span class="time text-muted">9:00<span class="mer">AM</span></span><span class="icon chev" aria-hidden="true">chevron_right</span></span>
        </button>
      </section>

      <section aria-labelledby="sec-permissions">
        <div class="section-head"><h2 id="sec-permissions" class="t-label">Permissions</h2></div>
        <button class="list-row">
          <span class="main">
            <span class="t-body">Reminder permissions<span class="attn-dot" role="img" aria-label="Needs attention"></span></span>
            <span class="t-caption t-2 truncate">Battery optimization not exempted</span>
          </span>
          <span class="icon chev" aria-hidden="true">chevron_right</span>
        </button>
      </section>

      <section aria-labelledby="sec-about">
        <div class="section-head"><h2 id="sec-about" class="t-label">About</h2></div>
        <div class="list-row"><span class="main t-body t-2">Version 1.0</span></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="#"><span class="dot"></span><span class="icon">calendar_today</span>Today</a>
    <a href="#"><span class="dot"></span><span class="icon">history</span>History</a>
    <a href="#"><span class="dot"></span><span class="icon">layers</span>Rooms</a>
    <a href="#" aria-current="page"><span class="dot"></span><span class="icon">settings</span>Settings</a>
  </nav>
</div>
</body>
</html>
