<body class="text-on-surface h-screen flex flex-col items-center justify-between px-margin-mobile pb-lg pt-4 selection:bg-inverse-surface selection:text-surface">
<!-- Top Spacer -->
<div class="flex-grow shrink-[2] min-h-[132px]"></div>
<!-- Main Content Container -->
<main class="w-full max-w-sm flex flex-col items-center justify-center flex-grow shrink-0 gap-lg">
<!-- App Mark: Clock at 7 o'clock -->
<div class="relative w-24 h-24 border-[1.5px] border-primary rounded-full flex items-center justify-center mb-md">
<!-- Center Dot -->
<div class="w-1.5 h-1.5 bg-primary rounded-full absolute"></div>
<!-- Minute Hand (12) -->
<div class="absolute w-[1.5px] h-10 bg-primary bottom-1/2 left-1/2 -translate-x-1/2 origin-bottom"></div>
<!-- Hour Hand (7) -->
<div class="absolute w-[1.5px] h-7 bg-primary bottom-1/2 left-1/2 -translate-x-1/2 origin-bottom -rotate-[150deg]"></div>
</div>
<!-- Typography -->
<div class="flex flex-col items-center gap-xs text-center">
<h1 class="font-title-lg-mobile text-title-lg-mobile text-primary">Type it. It reminds you.</h1>
<p class="font-mono-data text-mono-data text-on-surface-variant">dsa 7pm daily → done.</p>
</div>
</main>
<!-- Bottom Spacer -->
<div class="flex-grow shrink-[1]"></div>
<!-- Actions Container -->
<section class="w-full max-w-sm flex flex-col items-center gap-md">
<!-- Google Sign In Button (Primary/Inverted style per guidelines) -->
<button class="w-full h-12 bg-inverse-surface text-surface font-label text-label rounded-full flex items-center justify-center gap-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Skip / Continue without account (Tertiary style) -->
<button class="font-body text-body text-on-surface-variant hover:text-primary transition-colors py-2 focus:outline-none focus:underline">
            Continue without an account
        </button>
<!-- Contextual Caption -->
<p class="font-caption text-caption text-surface-tint text-center max-w-[280px] mt-sm">
            An account is only needed for sync and shared rooms. Everything else works offline.
        </p>
</section>
