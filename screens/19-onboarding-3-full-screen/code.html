<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Setup 3 of 4</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Onboarding template — identical across steps 1–4 (screens 17–20).
     Content is top-anchored, not vertically centred, so the icon and title
     sit at the same y on every step whatever the body length. */
  .onb-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: clamp(40px, 14dvh, 140px) var(--gutter) 0; }
  .onb-icon { position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; color: var(--text-1); }
  .onb-glyph { font-size: 64px; }
  .onb-inner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; }
  .onb-body h1 { margin-top: var(--gap-lg); }
  .onb-body p { margin-top: 12px; max-width: 32ch; color: var(--text-2); }
  .onb-actions { flex: none; padding: 0 var(--gutter); }
  .onb-actions .btn-text { color: var(--text-2); }
  .onb-steps { flex: none; display: flex; justify-content: center; gap: 6px; padding: var(--gap-md) var(--gutter) calc(var(--gap-lg) + env(safe-area-inset-bottom)); color: var(--text-2); font-size: 11px; }
  .onb-steps [aria-current="step"] { color: var(--text-1); }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sb-icons"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span></div>

  <div class="pager" role="img" aria-label="Step 3 of 4">
    <span></span>
    <span></span>
    <span aria-current="step"></span>
    <span></span>
  </div>

  <main class="onb-body">
    <div class="onb-icon" aria-hidden="true"><span class="icon onb-glyph">smartphone</span><span class="icon onb-inner">alarm</span></div>
    <h1 class="t-title">Wake your screen</h1>
    <p class="t-body">Allow the app to show reminders even when your phone is locked. This lets you see and snooze tasks without having to unlock first.</p>
  </main>

  <div class="onb-actions btn-stack">
    <button class="btn btn-primary">Allow full-screen reminders</button>
    <button class="btn btn-text">Later</button>
  </div>

  <p class="onb-steps t-label" aria-label="Setup steps: notifications, exact alarms, full-screen, battery">
    <span>1 NOTIFY</span>
    <span aria-hidden="true">·</span>
    <span>2 ALARMS</span>
    <span aria-hidden="true">·</span>
    <span aria-current="step">3 SCREEN</span>
    <span aria-hidden="true">·</span>
    <span>4 BATTERY</span>
  </p>
</div>
</body>
</html>
