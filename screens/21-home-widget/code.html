<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>INK — Home widget</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../_shared/ink-tailwind.js"></script>
<link rel="stylesheet" href="../_shared/ink.css"/>
<style>
  /* Launcher wallpaper: plain flat dark grey, nothing else on it. */
  .wallpaper { background: var(--raised); justify-content: center; padding: 0 var(--gutter); }
  /* 4×2 widget panel: radius 24, inner padding 16, hairline outline. */
  .widget { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--sheet-r); padding: var(--gap-md) var(--gap-md) var(--gap-xs); }
  .widget-head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
  .widget-row { display: flex; align-items: center; height: 40px; border-bottom: 1px solid var(--hairline); color: var(--text-2); }
  .widget-row .rail { width: 76px; flex: none; font-size: 14px; line-height: 20px; }
  .widget-row .title { flex: 1; min-width: 0; font-size: 15px; line-height: 20px; }
  .widget-row.is-next { color: var(--text-1); }
  .widget-row.is-next .title { font-weight: 600; }
  /* "+ Add todo": 48px target whose label sits on the widget's inner left edge. */
  .widget-add { display: inline-flex; align-items: center; gap: var(--gap-xs); height: var(--target); color: var(--text-1); font-weight: 500; margin-left: -2px; }
  .widget-add .icon { font-size: 20px; }
</style>
</head>
<body>
<div class="screen wallpaper">
  <section class="widget" aria-label="Ink — Today">
    <div class="widget-head">
      <span class="t-body w-semibold">Today</span>
      <span class="t-mono t-caption t-2">3 left</span>
    </div>
    <div class="widget-row is-next">
      <span class="rail time">5:00<span class="mer">PM</span></span>
      <span class="title truncate">Project Meeting</span>
    </div>
    <div class="widget-row">
      <span class="rail time">7:00<span class="mer">PM</span></span>
      <span class="title truncate">DSA</span>
    </div>
    <div class="widget-row">
      <span class="rail time">9:00<span class="mer">PM</span></span>
      <span class="title truncate">Read</span>
    </div>
    <button class="widget-add"><span class="icon" aria-hidden="true">add</span>Add todo</button>
  </section>
</div>
</body>
</html>
